<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="logologinpage-transparent.png">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a2e2e" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logologinpage-transparent.png">
  <title>PicklQ Login</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Rajdhani", "sans-serif"],
            body: ["Manrope", "sans-serif"],
          },
          colors: {
            beginner: "#1fcfb1",
            intermediate: "#F5C42A",
            advanced: "#f07840",
            ink: "#0a2e2e",
            panel: "#0f3d3d",
            orange: "#E85A1A",
            gold: "#F5C42A",
          },
          boxShadow: {
            glow: "0 0 24px rgba(31, 207, 177, 0.2)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
  <!-- Google reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js?onload=renderCaptchas&render=explicit" async defer></script>
  <style>
    /* Dark-theme reCAPTCHA wrapper */
    .recaptcha-wrap {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }
    /* Scale down reCAPTCHA on very small screens */
    @media (max-width: 360px) {
      .recaptcha-wrap > div {
        transform: scale(0.85);
        transform-origin: center;
      }
    }
    /* Lockout banner */
    #lockout-banner {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      font-size: 0.82rem;
      text-align: center;
    }
    /* Attempt counter */
    #attempt-counter {
      font-size: 0.75rem;
      color: #f07840;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
    
    /* Hide splash screen on mobile for login page */
    @media (max-width: 768px) {
      #splash-screen {
        display: none !important;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-ink font-body flex items-center justify-center p-4" style="color:#F2E8D5;">
  <!-- Splash / Loading Screen -->
  <div id="splash-screen">
    <img src="logologinpage-transparent.png" alt="PicklQ logo" class="splash-logo login-logo" onerror="this.style.display='none'" />
    <div>
      <p class="splash-title">PicklQ</p>
      <p class="splash-subtitle">Queuing System</p>
    </div>
    <div class="splash-spinner"></div>
  </div>

  <div class="page-bg"></div>

  <div class="glass-card w-full max-w-md relative z-10 p-8">
    <div class="text-center mb-8">
      <img src="logologinpage-transparent.png" alt="PicklQ logo" class="login-brand-logo mx-auto mb-4" onerror="this.style.display='none'" />
      <h1 id="auth-title" class="text-2xl font-display font-semibold text-gold">PicklQ Login</h1>
      <p class="text-slate-400 mt-2 text-sm">Sign in to manage queues and courts</p>
    </div>

    <!-- Lockout Banner -->
    <div id="lockout-banner"></div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" id="login-email" class="input-field w-full" autocomplete="email" required />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" class="input-field w-full pr-10" autocomplete="current-password" required />
          <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 focus:outline-none toggle-password" data-target="login-password">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <!-- Eye icon -->
              <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              <!-- Eye slash icon (hidden by default) -->
              <path class="eye-closed hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- reCAPTCHA v2 – Login -->
      <div class="recaptcha-wrap">
        <div id="recaptcha-login"></div>
      </div>

      <div id="attempt-counter" class="attempt-counter"></div>

      <button type="submit" class="btn-primary w-full py-3 mt-2">Sign In</button>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="register-form" class="space-y-4 hidden">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" id="register-email" class="input-field w-full" autocomplete="email" required />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="register-password" class="input-field w-full pr-10" autocomplete="new-password" required minlength="6" />
          <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 focus:outline-none toggle-password" data-target="register-password">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <!-- Eye icon -->
              <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              <!-- Eye slash icon (hidden by default) -->
              <path class="eye-closed hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Display Name</label>
        <input type="text" id="register-name" class="input-field w-full" autocomplete="name" required />
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Club</label>
        <select id="register-club" class="input-field w-full" required>
          <option value="deuce">Deuce Club</option>
          <option value="longos">Longos Pickleball Club</option>
        </select>
      </div>

      <!-- reCAPTCHA v2 – Register -->
      <div class="recaptcha-wrap">
        <div id="recaptcha-register"></div>
      </div>

      <button type="submit" class="btn-primary w-full py-3 mt-2" style="background: linear-gradient(135deg, rgba(31, 207, 177, 0.9), rgba(13, 148, 136, 0.9));">Register Account</button>
    </form>

    <div class="mt-6 text-center text-sm">
      <p id="toggle-text" class="text-slate-400">
        Don't have an account? <button type="button" id="toggle-btn" class="text-beginner hover:underline focus:outline-none">Register here</button>
      </p>
    </div>

    <!-- Error Message Display -->
    <div id="auth-error" class="hidden mt-4 p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">
    </div>
  </div>

  <script type="module" src="login.js?v=13"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
