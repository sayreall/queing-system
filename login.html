<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="deuce-game-logo.png">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a2e2e" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="deuce-game-logo.png">
  <title>Login - Pickleball Queuing System</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Rajdhani", "sans-serif"],
            body: ["Manrope", "sans-serif"],
          },
          colors: {
            beginner: "#1fcfb1",
            intermediate: "#F5C42A",
            advanced: "#f07840",
            ink: "#0a2e2e",
            panel: "#0f3d3d",
            orange: "#E85A1A",
            gold: "#F5C42A",
          },
          boxShadow: {
            glow: "0 0 24px rgba(31, 207, 177, 0.2)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function() {
      const club = localStorage.getItem("dq_club_preference");
      if (club === "longos") {
        document.title = "Login - Longos Pickleball Club";
        window.addEventListener("DOMContentLoaded", () => {
          document.querySelectorAll("img[src='deuce-game-logo.png']").forEach(img => img.src = "lpc-logo.png");
          document.querySelectorAll(".splash-title").forEach(el => el.textContent = "Longos Club");
          document.querySelectorAll(".font-display.text-gold").forEach(el => el.textContent = "Longos Pickleball Club");
          document.querySelectorAll("link[rel='shortcut icon'], link[rel='apple-touch-icon']").forEach(link => link.href = "lpc-logo.png");
        });
      }
    })();
  </script>
  <!-- Google reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js?onload=renderCaptchas&render=explicit" async defer></script>
  <style>
    /* Dark-theme reCAPTCHA wrapper */
    .recaptcha-wrap {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }
    /* Scale down reCAPTCHA on very small screens */
    @media (max-width: 360px) {
      .recaptcha-wrap > div {
        transform: scale(0.85);
        transform-origin: center;
      }
    }
    /* Lockout banner */
    #lockout-banner {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      font-size: 0.82rem;
      text-align: center;
    }
    /* Attempt counter */
    #attempt-counter {
      font-size: 0.75rem;
      color: #f07840;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>

<body class="min-h-screen bg-ink font-body flex items-center justify-center p-4" style="color:#F2E8D5;">
  <!-- Splash / Loading Screen -->
  <div id="splash-screen">
    <img src="deuce-game-logo.png" alt="Deuce Club Logo" class="splash-logo" onerror="this.style.display='none'" />
    <div>
      <p class="splash-title">Deuce Club</p>
      <p class="splash-subtitle">Queuing System</p>
    </div>
    <div class="splash-spinner"></div>
  </div>

  <div class="page-bg"></div>

  <div class="glass-card w-full max-w-md relative z-10 p-8">
    <div class="text-center mb-8">
      <img src="deuce-game-logo.png" alt="Logo" class="h-16 mx-auto mb-4" onerror="this.style.display='none'" />
      <h1 class="text-2xl font-display font-semibold text-gold">Deuce Club Queuing System</h1>
      <p class="text-slate-400 mt-2 text-sm">Sign in to manage queues and courts</p>
    </div>

    <!-- Lockout Banner -->
    <div id="lockout-banner"></div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" id="login-email" class="input-field w-full" autocomplete="email" required />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" id="login-password" class="input-field w-full" autocomplete="current-password" required />
      </div>

      <!-- reCAPTCHA v2 – Login -->
      <div class="recaptcha-wrap">
        <div id="recaptcha-login"></div>
      </div>

      <div id="attempt-counter" class="attempt-counter"></div>

      <button type="submit" class="btn-primary w-full py-3 mt-2">Sign In</button>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="register-form" class="space-y-4 hidden">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" id="register-email" class="input-field w-full" autocomplete="email" required />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" id="register-password" class="input-field w-full" autocomplete="new-password" required minlength="6" />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Display Name</label>
        <input type="text" id="register-name" class="input-field w-full" autocomplete="name" required />
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Club</label>
        <select id="register-club" class="input-field w-full" required>
          <option value="deuce">Deuce Club</option>
          <option value="longos">Longos Pickleball Club</option>
        </select>
      </div>

      <!-- reCAPTCHA v2 – Register -->
      <div class="recaptcha-wrap">
        <div id="recaptcha-register"></div>
      </div>

      <button type="submit" class="btn-primary w-full py-3 mt-2" style="background: linear-gradient(135deg, rgba(31, 207, 177, 0.9), rgba(13, 148, 136, 0.9));">Register Account</button>
    </form>

    <div class="mt-6 text-center text-sm">
      <p id="toggle-text" class="text-slate-400">
        Don't have an account? <button type="button" id="toggle-btn" class="text-beginner hover:underline focus:outline-none">Register here</button>
      </p>
    </div>

    <!-- Error Message Display -->
    <div id="auth-error" class="hidden mt-4 p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">
    </div>
  </div>

  <script type="module" src="login.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
